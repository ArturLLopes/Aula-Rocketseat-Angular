<form class="rouded-xl overflow-hidden bg-white">
  <div class="flex gap-1 items-center p-4">
    <img src="images/icon-new-task.svg" alt="">
    <h1 class="font-semibold text-lg">Criar/Editar tarefa</h1>
    <img class="ml-auto cursor-pointer" src="images/icon-close.svg" alt="">
  </div>

  <div class="p-4 border-y border-[#d1d5db] flex flex-col gap-4">
    <div>
      <p class="font-semibold text-sm mb-2">Nome</p>
      <input class="w-full border border-[#d1d4db] p-3 rounded-lg text-sm font-light text-[#89919f]" type="text"
        placeholder="Descreva o que deverá ser feito" />
      <p class="font-semibold text-sm text-red-500">O campo é obrigatorio e precisa ter no minímo 10 caracteres.</p>
    </div>
  </div>
  <div class="p-4 border-y border-[#d1d5db] flex flex-col gap-4">
    <div>
      <p class="font-semibold text-sm mb-2">Descrição</p>
      <input class="w-full border border-[#d1d4db] p-3 rounded-lg text-sm font-light text-[#89919f]" type="text"
        placeholder="Adicione uma Descrição" />
      <p class="font-semibold text-sm text-red-500">O campo é obrigatorio e precisa ter no minímo 10 caracteres.</p>
    </div>
    <div class="p-4 flex justify-end gap-2">
      <button
        class="py-3 px-4 bg-[#fafafa] rounded-xl text-sm font-semibold cursor-pointer active:translate-y-1 transition-transform duration-75"
        type="button">Cancelar</button>
      <button
        class="py-3 px-4 bg-[#2a89ef] rounded-xl text-sm font-semibold cursor-pointer active:translate-y-1 transition-transform duration-75 shadow-md  shadow-blue-500/50"
        type="submit">Criar uma tarefa</button>

    </div>
  </div>

</form>
