<div
  class="rounded-2xl p-8 bg-[#ecf4fe] flex flex-col items-center text-center gap-7 sm:flex-row-reverse sm:justify-between sm:items-center sm:text-left mb-8">
  <div>
    <img src="images/icon-hand-coding.svg" alt="">
  </div>

  <div class="flex flex-col gap-4 items-center sm:items-start">
    <div>
      <h1 class="font-bold text-2xl">Bem vindo de volta!</h1>
      <h3 class="font-medium opacity-80 text-[#374151]">Não esqueça de atualizar as tarefas</h3>
    </div>
    <div>
      <button
        class="bg-[#2a89ef] shadow-md shadow-blue-500/50 py-3 px-4 rounded-xl text-white text-sm font-semibold text-center flex gap-2 items-center cursor-pointer active:translate-y-1 transition-transform duration-75" (click)="openNewTaskModal()">
        <img src="images/icon-plus-circle.svg" alt="">
        Criar uma tarefa
      </button>
    </div>
  </div>
</div>
